<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <style>
        body {
            background-color: #011b19;
            color: #35b4aa;
            font-family: Arial, sans-serif;
            padding: 20px;
            text-align: center;
        }
        .grid-sensores {
            display: grid;
            /* Corrigido para auto-fit com hífen */
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
            margin-bottom: 20px;
        }
        .card {
            background-color: #022f2c;
            border-radius: 8px;
            border: 1px solid #35b4aa;
            text-align: center;
            padding: 20px;
        }
        #painel-alertas {
            padding: 12px;
            border-radius: 6px;
            margin-top: 20px;
            font-weight: bold;
            text-align: center;
            transition: background 0.3s ease;
        }
        .alerta-normal { background-color: #022c29; border: 1px solid #35b4aa; color: #35b4aa; }
        .alerta-perigo { background-color: #5a1818; border: 1px solid #ff5555; color: #ff9999; animation: pulsar 1.5s infinite; }

        @keyframes pulsar {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
    </style>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Estação Meteorológica</title>
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <h1>Estação Meteorológica Inteligente</h1>

    <!-- Painel de Alertas -->
    <div id="painel-alertas" class="alerta-normal">
        <span id="texto-alerta">⚠️ A aguardar dados do sistema...</span>
    </div>

    <!-- Mapa de Geolocalização -->
    <div class="card" style="margin-top: 20px;">
        <h3>Localização da Estação</h3>
        <div id="map" style="height: 250px; border-radius: 6px; margin-top: 10px;"></div>
    </div>

    <!-- Grelha de Sensores -->
    <div class="grid-sensores">
        <div class="card">
            <h3>Temperatura</h3>
            <p id="val-temp">-- °C</p>
        </div>
        <div class="card">
            <h3>Umidade</h3>
            <p id="val-umid">-- %</p>
        </div>
        <div class="card">
            <h3>Pressão</h3>
            <p id="val-press">-- hPa</p>
        </div>
        <div class="card">
            <h3>Qualidade do Ar</h3>
            <p id="val-qualidade">-- AQI</p>
        </div>
        <div class="card">
            <h3>Luminosidade</h3>
            <p id="val-luminosidade">-- lux</p>
        </div>
        <div class="card">
            <h3>Chuva</h3>
            <p id="val-chuva">-- mm</p>
        </div>
    </div>

    <script>
        // 1. Inicialização do Mapa Leaflet
        const mapa = L.map('map').setView([-23.5505, -46.6333], 13); // Coordenadas de exemplo (São Paulo)

// Substituir o tile layer da Carto pela camada gratuita do OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19
        }).addTo(mapa);

        L.marker([-23.5505, -46.6333]).addTo(mapa)
            .bindPopup('<b>Estação Meteorológica Inteligente</b><br>Estado: Operacional')
            .openPopup();

        // 2. Ligação ao Supabase
        const SUPABASE_URL = "https://whxofybeklkfriopmeio.supabase.co";
        const SUPABASE_KEY = "sb_publishable_l_AyF11bYCRSKZaFMEVE_w_I0XX04KA";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 3. Função principal para buscar dados e atualizar a interface
        async function carregarDados() {
            try {
                const { data, error } = await supabaseClient
                    .from('telemetria')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(1);

                if (error) throw error;

                if (data && data.length > 0) {
                    const ultimo = data[0];
                    
                    // Atualizar os cartões com os valores reais
                    document.getElementById('val-temp').innerText = `${ultimo.temp_dht} °C`;
                    document.getElementById('val-umid').innerText = `${ultimo.humidity} %`;
                    document.getElementById('val-press').innerText = `${ultimo.pressure} hPa`;
                    document.getElementById('val-qualidade').innerText = `${ultimo.air_quality} AQI`;
                    document.getElementById('val-luminosidade').innerText = `${ultimo.luminosity} lux`;
                    document.getElementById('val-chuva').innerText = `${ultimo.rain} mm`;

                    // Lógica de Alertas Climáticos (dentro da função onde 'ultimo' existe)
                    const painelAlerta = document.getElementById('painel-alertas');
                    const textoAlerta = document.getElementById('texto-alerta');

                    if (ultimo.air_quality > 300 || ultimo.rain > 2000) {
                        painelAlerta.className = 'alerta-perigo';
                        textoAlerta.innerText = '🚨 ALERTA CRÍTICO: Níveis de poluição ou precipitação elevados detetados!';
                    } else {
                        painelAlerta.className = 'alerta-normal';
                        textoAlerta.innerText = '⚠️ Sistema a operar dentro dos parâmetros normais.';
                    }
                }
            } catch (err) {
                console.error('Erro ao buscar dados do Supabase:', err);
            }
        }
        

        carregarDados();
        setInterval(carregarDados, 5000);
    </script>
  </body>
</html>
