<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <style>
        body {
            background-color:#011b19;
            color: #35b4aa;
            font-family: Arial, sans-serif;
            padding: 20px;
            text-align: center;
        }
        .grid-sensores {
            display: grid;
            grid-template-columns: repeat(autofit, minmax(200px, 1fr));
            gap:20px;
            margin-top: 20px;
        }
        .card {
            background-color: #022f2c;
            border-radius: 8px;
            border: 1px solid #35b4aa;
            text-align: center;
            padding: 20px;
        }
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <h1>Estação Meteorológica</h1>
    <div class="grid-sensores">
        <div class="card">
            <h3>Temperatura</h3>
            <p id="val-temp">-- °C</p>
        </div>
        <div class="card">
            <h3>Umidade</h3>
            <p id="val-umid">-- %</p>
        </div>
        <div class="card">
            <h3>Pressão</h3>
            <p id="val-press">-- hPa</p>
        </div>
        <div class="card">
            <h3>Qualidade do Ar</h3>
            <p id="val-qualidade">-- AQI</p>
        </div>
        <div class="card">
            <h3>Luminosidade</h3>
            <p id="val-luminosidade">-- lux</p>
        </div>
        <div class="card">
            <h3>Chuva</h3>
            <p id="val-chuva">-- mm</p>
        </div>
    </div>
<script>

        const SUPABASE_URL = "https://whxofybeklkfriopmeio.supabase.co"
        const SUPABASE_KEY = "sb_publishable_l_AyF11bYCRSKZaFMEVE_w_I0XX04KA"
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function carregarDados() {
            try {
                const { data, error } = await supabaseClient
                    .from('telemetria')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(1);

                if (error) throw error;

                if (data && data.length > 0) {
                    const ultimo = data[0];
                    
                    // 4. Atualizar os cartões com os IDs correspondentes
                    document.getElementById('val-temp').innerText = `${ultimo.temp_dht} °C`;
                    document.getElementById('val-umid').innerText = `${ultimo.humidity} %`;
                    document.getElementById('val-press').innerText = `${ultimo.pressure} hPa`;
                    document.getElementById('val-qualidade').innerText = `${ultimo.air_quality} AQI`;
                    document.getElementById('val-luminosidade').innerText = `${ultimo.luminosity} lux`;
                    document.getElementById('val-chuva').innerText = `${ultimo.rain} mm`;
                }
            } catch (err) {
                console.error('Erro ao buscar dados do Supabase:', err);
            }
        }
        
        carregarDados();
        setInterval(carregarDados, 5000);
    </script>
  </body>
</html>
